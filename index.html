}
.hero-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.hero-card::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, hsla(188, 99%, 39%, 0.25) 0%, hsla(188, 99%, 39%, 0) 70%);
}
.hero-card-content {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: center;
}
.hero-card .eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-primary-300);
  margin-bottom: 10px;
}
.hero-card h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  margin: 0 0 12px;
  color: #fff;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.hero-card .desc {
  font-size: 15px;
  color: hsla(0, 0%, 100%, 0.78);
  line-height: 1.55;
  max-width: 520px;
  margin: 0 0 20px;
}
.hero-card .feature-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.hero-card .feature-chips .chip {
  background: hsla(0, 0%, 100%, 0.1);
  border: 1px solid hsla(0, 0%, 100%, 0.18);
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 500;
  color: #fff;
  display: inline-flex; align-items: center; gap: 6px;
}
.hero-card .feature-chips .chip .ico { font-size: 14px; color: var(--color-primary-300); }
.hero-card .price-block {
  text-align: right;
  flex-shrink: 0;
}
.hero-card .price-block .price-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-primary-300);
}
.hero-card .price-block .price {
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  margin-top: 6px;
}
.hero-card .price-block .price-sub {
  font-size: 13px;
  color: hsla(0, 0%, 100%, 0.6);
  margin-top: 6px;
}
.hero-card .discover {
  margin-top: 20px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-primary-300);
  transition: gap 0.15s;
}
.hero-card:hover .discover { gap: 10px; }
.hero-card .discover .ico { font-size: 18px; }

/* ─── Effectif chips ─────────────────────────────────────── */
.effectif-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.effectif-chip {
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-6);
  padding: 8px 10px;
  cursor: pointer;
  text-align: left;
  display: flex; flex-direction: column; gap: 2px;
  transition: all 0.12s;
  font-family: var(--font-body);
}
.effectif-chip:hover { border-color: var(--color-primary-400); background: var(--color-primary-100); }
.effectif-chip.selected {
  border-color: var(--color-primary-400);
  background: var(--color-primary-100);
  box-shadow: 0 0 0 3px var(--color-primary-200);
}
.effectif-chip .effectif-range {
  font-size: 12px;
  font-weight: 700;
  color: var(--color-secondary-500);
}
.effectif-chip .effectif-price {
  font-size: 11px;
  color: var(--color-neutral-800);
  font-weight: 500;
}
.effectif-chip.selected .effectif-price { color: var(--color-primary-600); }

/* ─── Toggles & switches ─────────────────────────────────── */
.seg {
  display: inline-flex;
  background: var(--color-neutral-100);
  border-radius: var(--r-6);
  padding: 3px;
  gap: 2px;
}
.seg button {
  border: 0; background: transparent;
  padding: 6px 12px;
  font-size: 12px; font-weight: 600;
  color: var(--color-neutral-800);
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-body);
}
.seg button.active {
  background: #fff;
  color: var(--color-secondary-500);
  box-shadow: var(--shadow-sm);
}

.switch {
  position: relative;
  display: inline-block;
  width: 36px; height: 20px;
  background: var(--color-neutral-500);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
}
.switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: #fff;
  border-radius: 50%;
  transition: left 0.15s;
}
.switch.on { background: var(--color-primary-400); }
.switch.on::after { left: 18px; }

/* ─── Packs grid ────────────────────────────────────────── */
.packs-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.pack-card {
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  padding: 24px;
  position: relative;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
  display: flex; flex-direction: column;
}
.pack-card:hover { border-color: var(--color-primary-400); box-shadow: var(--shadow-sm); }
.pack-card.selected {
  border-color: var(--color-primary-400);
  box-shadow: 0 0 0 3px var(--color-primary-200), var(--shadow-sm);
}
.pack-card .pack-icon {
  width: 44px; height: 44px;
  border-radius: var(--r-8);
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.pack-card .pack-icon .ico { font-size: 22px; }
.pack-card.scaling .pack-icon { background: var(--color-primary-200); color: var(--color-primary-500); }
.pack-card.entreprise .pack-icon { background: var(--color-secondary-500); color: #fff; }
.pack-card.multi .pack-icon { background: var(--color-pink-200); color: var(--color-pink-600); }
.pack-card h4 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 4px;
  color: var(--color-secondary-500);
}
.pack-card .pack-tagline {
  font-size: 13px;
  color: var(--color-neutral-800);
  margin: 0 0 16px;
  min-height: 36px;
}
.pack-card .pack-features { list-style: none; padding: 0; margin: 0 0 18px; }
.pack-card .pack-features li {
  font-size: 13px;
  color: var(--color-secondary-500);
  padding: 6px 0;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--color-neutral-100);
}
.pack-card .pack-features li:last-child { border-bottom: 0; }
.pack-card .pack-features li .ico {
  font-size: 16px;
  color: var(--color-primary-400);
  flex-shrink: 0;
}
.pack-card .pack-price {
  margin-top: auto;
  display: flex; align-items: baseline; justify-content: space-between;
  padding-top: 16px;
  border-top: 1px solid var(--color-neutral-200);
}
.pack-card .pack-price .price {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--color-secondary-500);
}
.pack-card .pack-price .unit {
  font-size: 12px;
  color: var(--color-neutral-800);
  font-weight: 500;
}
.pack-card .pack-cta {
  margin-top: 14px;
  text-align: center;
  border: 1px solid var(--color-neutral-500);
  border-radius: var(--r-6);
  padding: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-secondary-500);
}
.pack-card.selected .pack-cta {
  background: var(--color-primary-400);
  color: #fff;
  border-color: var(--color-primary-400);
}
.pack-card .badge-corner {
  position: absolute;
  top: 12px;
  right: 12px;
}
.pack-card.coming { opacity: 0.65; }
.pack-card.coming:hover { border-color: var(--border-subtle); box-shadow: none; }

/* ─── Options grid ────────────────────────────────────────── */
.options-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.option-card {
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  padding: 20px;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
  position: relative;
  display: flex; flex-direction: column;
  min-height: 200px;
}
.option-card:hover {
  border-color: var(--color-primary-300);
  box-shadow: var(--shadow-sm);
  transform: translateY(-1px);
}
.option-card.selected {
  border-color: var(--color-primary-400);
  box-shadow: 0 0 0 3px var(--color-primary-200);
}
.option-card .icon-wrap {
  width: 40px; height: 40px;
  border-radius: var(--r-8);
  background: var(--color-primary-100);
  color: var(--color-primary-500);
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.option-card.partner .icon-wrap { background: var(--color-blue-200); color: var(--color-blue-600); }
.option-card.coming .icon-wrap { background: var(--color-neutral-200); color: var(--color-neutral-800); }
.option-card .icon-wrap .ico { font-size: 22px; }
.option-card h4 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 6px;
  color: var(--color-secondary-500);
}
.option-card .desc {
  font-size: 13px;
  color: var(--color-neutral-800);
  margin: 0 0 14px;
  line-height: 1.5;
  flex: 1;
}
.option-card .option-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--color-neutral-100);
}
.option-card .option-price {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  color: var(--color-secondary-500);
}
.option-card .option-price .small {
  font-size: 11px;
  color: var(--color-neutral-800);
  font-weight: 500;
}
.option-card .option-toggle {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-primary-600);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px;
  min-height: 40px;
  border: 1px solid var(--color-primary-200);
  border-radius: var(--r-pill);
  background: var(--color-primary-100, hsla(188, 99%, 39%, 0.08));
  transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
}
.option-card .option-toggle:hover {
  background: var(--color-primary-500);
  border-color: var(--color-primary-500);
  color: #fff;
}
.option-card .option-toggle .ico { font-size: 18px; }
.option-card.selected .option-toggle {
  border-color: var(--color-neutral-300);
  background: #fff;
  color: var(--color-neutral-800);
}
.option-card.selected .option-toggle:hover {
  border-color: hsl(0, 62%, 60%);
  background: hsla(0, 62%, 50%, 0.08);
  color: hsl(0, 62%, 45%);
}
.option-card .badge-corner {
  position: absolute;
  top: 14px; right: 14px;
}

/* When option is selected — show checked icon */
.option-card .check-mark {
  position: absolute;
  top: 14px; right: 14px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--color-primary-400);
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.12s;
}
.option-card .check-mark .ico { font-size: 14px; }
.option-card.selected .check-mark { opacity: 1; }
.option-card.selected .badge-corner { display: none; }

/* ─── CSM Timeline card ────────────────────────────────── */
.csm-card {
  background: #01AEC8;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-16);
  padding: 28px 32px;
  position: relative;
  overflow: hidden;
}
.csm-card-top {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
  margin-bottom: 28px;
}
.csm-card .header-block .label {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-primary-500);
  margin-bottom: 6px;
}
.csm-card h3 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 6px;
  color: #fff;
}
.csm-card .header-block .desc {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.92);
  margin: 0;
  max-width: 560px;
  line-height: 1.5;
}
.csm-card .badge-included {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff;
  color: var(--color-green-600);
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 700;
}
.csm-timeline {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding-top: 12px;
}
.csm-timeline::before {
  content: '';
  position: absolute;
  top: 28px; left: 24px; right: 24px;
  height: 2px;
  background: linear-gradient(90deg,
    var(--color-primary-400) 0%,
    var(--color-primary-300) 50%,
    var(--color-secondary-300) 100%);
}
.csm-phase {
  position: relative;
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  padding: 18px;
  padding-top: 44px;
}
.csm-phase::before {
  content: '';
  position: absolute;
  top: -7px; left: 18px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--color-primary-400);
  border: 3px solid #fff;
  box-shadow: 0 0 0 1px var(--color-primary-300);
}
.csm-phase-num {
  position: absolute;
  top: 18px; left: 18px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-primary-500);
}
.csm-phase-period {
  position: absolute;
  top: 18px; right: 18px;
  font-size: 11px;
  color: var(--color-neutral-800);
  font-weight: 500;
}
.csm-phase h4 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 8px;
  color: var(--color-secondary-500);
}
.csm-phase .desc {
  font-size: 12px;
  color: var(--color-neutral-800);
  margin: 0 0 10px;
  line-height: 1.5;
}
.csm-phase .actions {
  display: flex; flex-wrap: wrap; gap: 4px;
}
.csm-phase .actions .pill {
  font-size: 10px;
  font-weight: 600;
  background: var(--color-neutral-100);
  color: var(--color-secondary-500);
  padding: 3px 8px;
  border-radius: var(--r-pill);
}
.csm-card .discover-link {
  margin-top: 24px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
}
.csm-card .discover-link:hover { color: rgba(255, 255, 255, 0.8); }

/* ─── Drawer ────────────────────────────────────────────── */
.drawer-backdrop {
  position: fixed; inset: 0;
  background: var(--color-overlay);
  opacity: 0;
  transition: opacity 0.18s;
  pointer-events: none;
  z-index: 100;
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(640px, 95vw);
  background: #fff;
  z-index: 110;
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}
.drawer-head .title-block { flex: 1; min-width: 0; }
.drawer-head .eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-primary-500);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.drawer-head h3 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  margin: 0;
  color: var(--color-secondary-500);
  line-height: 1.2;
}
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
}
.drawer-foot {
  padding: 18px 28px;
  border-top: 1px solid var(--border-subtle);
  background: var(--color-neutral-50);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}

/* Drawer content blocks */
.drawer .mockup {
  background: linear-gradient(135deg, var(--color-neutral-100) 0%, var(--color-neutral-200) 100%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  height: 240px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.drawer .mockup.mockup-screenshot {
  height: auto;
  display: block;
  background: none;
}
.drawer .mockup .ico { font-size: 56px; color: var(--color-neutral-700); }
.drawer .mockup .mockup-label {
  position: absolute;
  bottom: 12px; left: 12px;
  background: hsla(212, 37%, 15%, 0.8);
  color: #fff;
  padding: 4px 10px;
  border-radius: var(--r-4);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.drawer .section-block { margin-bottom: 24px; }
.drawer .section-block h4 {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 12px;
  color: var(--color-secondary-500);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.drawer .desc-text {
  font-size: 14px;
  color: var(--color-neutral-800);
  line-height: 1.6;
  margin: 0 0 16px;
}
.benefits-list { list-style: none; padding: 0; margin: 0; }
.benefits-list li {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px;
  color: var(--color-secondary-500);
  padding: 10px 0;
  border-bottom: 1px solid var(--color-neutral-100);
  line-height: 1.5;
}
.benefits-list li:last-child { border-bottom: 0; }
.benefits-list li .ico {
  font-size: 18px;
  color: var(--color-primary-400);
  flex-shrink: 0;
  margin-top: 1px;
}

/* Pricing breakdown */
.price-rows { display: flex; flex-direction: column; gap: 0; }
.price-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--color-neutral-100);
  font-size: 13px;
}
.price-row:last-child { border-bottom: 0; }
.price-row .label {
  color: var(--color-secondary-500);
  display: flex; align-items: center; gap: 10px;
  flex: 1; min-width: 0;
}
.price-row .label .key {
  font-weight: 600;
}
.price-row .label .meta {
  font-size: 11px;
  color: var(--color-neutral-800);
  font-weight: 400;
}
.price-row .value {
  font-weight: 700;
  color: var(--color-secondary-500);
  font-family: var(--font-display);
  font-size: 13px;
  white-space: nowrap;
}
.price-row.muted .value { color: var(--color-neutral-800); }
.price-row.discount .value { color: var(--color-success-500); }
.price-row.discount .label .key { color: var(--color-success-500); }

.price-row .remove-btn {
  border: 0; background: transparent;
  color: var(--color-neutral-700);
  cursor: pointer;
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px;
}
.price-row .remove-btn:hover { background: var(--color-neutral-200); color: var(--color-error-400); }
.price-row .remove-btn .ico { font-size: 16px; }

.empty-state {
  padding: 16px;
  text-align: center;
  border: 1px dashed var(--border-subtle);
  border-radius: var(--r-6);
  font-size: 12px;
  color: var(--color-neutral-800);
}

/* Pricing sub-group label */
.pricing-group {
  margin-bottom: 20px;
}
.pricing-group:last-child { margin-bottom: 0; }
.pricing-group .group-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
  margin-bottom: 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.pricing-group .group-label .badge-mini {
  background: var(--color-neutral-100);
  color: var(--color-neutral-800);
  padding: 2px 6px;
  border-radius: var(--r-4);
  font-size: 10px;
  font-weight: 700;
}

/* Discount input */
.discount-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px;
}
.discount-input {
  flex: 1;
  display: flex; align-items: center; gap: 0;
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-6);
  overflow: hidden;
}
.discount-input input {
  flex: 1;
  border: 0; outline: 0;
  padding: 8px 10px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--color-secondary-500);
  background: transparent;
  min-width: 0;
  width: 100%;
}
.discount-input input:focus { box-shadow: none; }
.discount-input .unit {
  padding: 0 10px;
  height: 32px;
  display: inline-flex; align-items: center;
  background: var(--color-neutral-100);
  font-size: 12px;
  font-weight: 700;
  color: var(--color-neutral-800);
  border-left: 1px solid var(--border-subtle);
}

.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
  gap: 12px;
}
.toggle-row .toggle-label {
  font-size: 13px;
  color: var(--color-secondary-500);
  font-weight: 500;
  flex: 1;
}
.toggle-row .toggle-meta {
  font-size: 11px;
  color: var(--color-neutral-800);
  font-weight: 400;
  display: block;
}

.total-block {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.total-block .total-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-neutral-700);
  margin-bottom: 4px;
}
.total-block .total-value {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  color: var(--color-secondary-500);
  line-height: 1;
}
.total-block .total-value .currency {
  font-size: 18px;
  color: var(--color-neutral-800);
  font-weight: 500;
  margin-left: 4px;
}
.total-block .total-period {
  font-size: 11px;
  color: var(--color-neutral-800);
  margin-top: 4px;
}
.total-block > div { width: 100%; }
.total-line {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
}
.total-line .line-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-secondary-500);
}
.total-line .line-meta {
  font-size: 10.5px;
  color: var(--color-neutral-800);
  font-weight: 500;
  margin-top: 2px;
}
.total-line .line-value {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--color-secondary-500);
  white-space: nowrap;
}
.total-line .line-value .currency {
  font-size: 12px;
  color: var(--color-neutral-800);
  font-weight: 500;
  margin-left: 2px;
}
.total-divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 8px 0 10px;
}

/* ─── Consommation cards ───────────────────────────────── */
.consom-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.consom-card {
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  padding: 16px;
}
.consom-card h4 {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 12px;
  color: var(--color-secondary-500);
  display: flex; align-items: center; gap: 8px;
}
.consom-card h4 .ico { font-size: 18px; color: var(--color-primary-400); }
.consom-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0;
  font-size: 12px;
  border-bottom: 1px dashed var(--color-neutral-200);
}
.consom-row:last-child { border-bottom: 0; }
.consom-row .label { color: var(--color-neutral-800); font-weight: 500; }
.consom-row .value { color: var(--color-secondary-500); font-weight: 700; }
.consom-row.included .value { color: var(--color-success-500); }

/* ─── Negotiation card ───────────────────────────────── */
.nego-card {
  background: linear-gradient(135deg, var(--color-orange-100) 0%, var(--color-orange-200) 100%);
  border: 1px solid hsla(35, 100%, 70%, 0.4);
  border-radius: var(--r-8);
  padding: 16px;
}
.nego-card h4 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--color-orange-600);
  display: flex; align-items: center; gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.nego-card h4 .ico { font-size: 16px; }
.nego-card .nego-item {
  font-size: 12px;
  color: var(--color-secondary-500);
  padding: 4px 0;
  display: flex; align-items: flex-start; gap: 6px;
  line-height: 1.4;
}
.nego-card .nego-item::before {
  content: '•';
  color: var(--color-orange-600);
  font-weight: 700;
  flex-shrink: 0;
}

/* ─── Tabs (in drawer) ───────────────────────────────── */
.drawer-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 20px;
  margin-top: -8px;
}
.drawer-tabs button {
  border: 0; background: transparent;
  padding: 10px 0;
  margin-right: 20px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--color-neutral-800);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  position: relative;
  top: 1px;
}
.drawer-tabs button.active {
  color: var(--color-primary-500);
  border-bottom-color: var(--color-primary-400);
}
.drawer-tabs button:hover:not(.active) { color: var(--color-secondary-500); }

/* ─── Misc ───────────────────────────────────────────── */
.divider { border-top: 1px solid var(--border-subtle); margin: 16px 0; }

.partner-logo {
  width: 40px; height: 40px;
  border-radius: var(--r-6);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
}

/* Scrollbars */
.pricing-body::-webkit-scrollbar,
.drawer-body::-webkit-scrollbar { width: 8px; }
.pricing-body::-webkit-scrollbar-thumb,
.drawer-body::-webkit-scrollbar-thumb { background: var(--color-neutral-400); border-radius: 4px; }
.pricing-body::-webkit-scrollbar-thumb:hover,
.drawer-body::-webkit-scrollbar-thumb:hover { background: var(--color-neutral-600); }

/* ─── Responsive ───────────────────────────────────────── */
@media (max-width: 1180px) {
  .app-shell,
  .app-shell.panel-collapsed { grid-template-columns: 1fr; }
  .summary-card {
    position: static; height: auto; border-left: 0;
    border-top: 1px solid var(--border-subtle); box-shadow: none;
    order: 99;
  }
  .summary-body { max-height: none; }
}
@media (max-width: 1100px) {
  .options-grid, .packs-grid { grid-template-columns: 1fr 1fr; }
  .consom-grid { grid-template-columns: 1fr 1fr; }
}

/* ─── Roadmap pill ──────────────────────────────────────── */
.effectif-hint {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 10px;
  padding: 10px 12px;
  background: hsla(38, 92%, 50%, 0.10);
  border: 1px solid hsla(38, 92%, 50%, 0.25);
  border-radius: var(--r-8);
  font-size: 11.5px;
  line-height: 1.45;
  color: hsl(28, 78%, 32%);
}
.effectif-hint .ico { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

.csm-phase-meta {
  font-size: 12px;
  font-weight: 500;
  color: var(--color-neutral-800);
  margin-left: 4px;
}

.option-price.partner-cta {
  color: var(--color-neutral-800);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
}

/* ─── Hero card "Tout inclus" sticker ──────────────────── */
.hero-included-sticker {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px 8px 10px;
  background: hsla(151, 55%, 41%, 0.95);
  color: #fff;
  border-radius: var(--r-pill);
  box-shadow: 0 4px 14px rgba(11, 23, 54, 0.18);
  transform: rotate(2deg);
  z-index: 2;
}
.hero-included-sticker .ico {
  font-size: 22px;
  flex-shrink: 0;
}
.hero-included-sticker strong {
  display: block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.1;
}
.hero-included-sticker span {
  display: block;
  font-size: 10.5px;
  font-weight: 500;
  opacity: 0.92;
  margin-top: 1px;
}
.hero-card { position: relative; }

/* ─── CSM mockup as a photo ───────────────────────────── */
.mockup-photo {
  padding: 0 !important;
  overflow: hidden;
  background: var(--color-neutral-100);
  height: 220px;
  position: relative;
}
.mockup-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.mockup-photo .mockup-label {
  position: absolute;
  left: 16px;
  bottom: 16px;
  background: rgba(11, 23, 54, 0.7);
  color: #fff;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  backdrop-filter: blur(4px);
}
.mockup-photo.mockup-photo-failed {
  background: linear-gradient(135deg, var(--color-primary-200) 0%, var(--color-primary-300) 100%);
}

/* ─── Partner logo (real image) ───────────────────────── */
.partner-logo-img {
  max-width: 88%;
  max-height: 88%;
  object-fit: contain;
}
.partner-logo {
  overflow: hidden;
}

/* ─── Pack feature expandable list ────────────────────── */
.pack-feature-list { padding: 0; margin: 0; }
.pack-feature-item {
  list-style: none;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  margin-bottom: 8px;
  background: #fff;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.pack-feature-item.expandable:hover {
  border-color: hsla(188, 99%, 39%, 0.5);
}
.pack-feature-item.open {
  border-color: var(--color-primary-400);
  box-shadow: 0 1px 0 var(--color-primary-100, var(--color-neutral-100));
}
.pack-feature-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: transparent;
  border: 0;
  text-align: left;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--color-secondary-500);
  cursor: pointer;
  transition: background 150ms ease;
}
.pack-feature-trigger:disabled { cursor: default; }
.pack-feature-item.expandable .pack-feature-trigger:hover {
  background: var(--color-neutral-50);
}
.pack-feature-trigger > .ico:first-child {
  color: var(--color-primary-500);
  flex-shrink: 0;
  font-size: 20px;
}
.pack-feature-label {
  flex: 1;
}
.pack-feature-chevron {
  font-size: 20px !important;
  color: var(--color-neutral-800);
  transition: transform 200ms ease, color 200ms ease;
}
.pack-feature-item.open .pack-feature-chevron {
  transform: rotate(180deg);
  color: var(--color-primary-500);
}
.pack-feature-details {
  padding: 0 14px 14px 44px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--color-neutral-800);
  animation: featureFade 180ms ease;
}
@keyframes featureFade {
  from { opacity: 0; transform: translateY(-2px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── Export PDF : benefits sous chaque prestation ───── */
.exd-row { align-items: stretch; }
.exd-row-main { flex: 1; }
.exd-row-benefits {
  list-style: none;
  padding: 0;
  margin: 10px 0 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 14px;
}
.exd-row-benefits li {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 11px;
  color: var(--color-neutral-800);
  line-height: 1.4;
}
.exd-row-benefits li .ico {
  font-size: 13px;
  color: var(--color-success-500);
  flex-shrink: 0;
  margin-top: 1px;
}
.roadmap-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: hsla(38, 92%, 50%, 0.14);
  color: hsl(28, 78%, 38%);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  vertical-align: middle;
}
.roadmap-pill .ico { font-size: 12px; }

/* ─── Socle price unit ──────────────────────────────────── */
.price-block .price-unit {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-neutral-800);
  letter-spacing: 0;
  margin-left: 2px;
}

/* ─── Négociation grid (4 cards) ─────────────────────────── */
.nego-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.nego-card.highlight {
  background: linear-gradient(180deg, hsla(188, 99%, 39%, 0.06) 0%, #fff 60%);
  border-color: hsla(188, 99%, 39%, 0.35);
}
.nego-card.highlight h4 .ico { color: var(--color-primary-500); }
.nego-hint {
  font-size: 12px;
  color: var(--color-neutral-800);
  font-style: italic;
  margin-bottom: 10px;
  line-height: 1.5;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--color-neutral-200);
}

/* ─── Export Modal ──────────────────────────────────────── */
.export-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11, 23, 54, 0.7);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  flex-direction: column;
  animation: exportFade 180ms ease;
}
@keyframes exportFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.export-toolbar {
  background: #fff;
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}
.export-toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--color-secondary-500);
}
.export-toolbar-left .ico { color: var(--color-primary-500); }
.export-toolbar-left strong {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
}
.export-toolbar-meta {
  font-size: 12px;
  color: var(--color-neutral-800);
  font-weight: 500;
  padding-left: 8px;
  border-left: 1px solid var(--border-subtle);
  margin-left: 4px;
}
.export-toolbar-right {
  display: flex;
  gap: 8px;
}
.export-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 32px 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.export-doc {
  background: #fff;
  width: 100%;
  max-width: 820px;
  min-height: 100%;
  border-radius: var(--r-16);
  box-shadow: 0 20px 60px rgba(11, 23, 54, 0.25);
  padding: 56px 56px 40px;
  font-family: var(--font-body);
  color: var(--color-secondary-500);
  display: flex;
  flex-direction: column;
}
.export-doc > .exd-footer { margin-top: auto; }

/* Header */
.exd-head {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 24px;
  padding-bottom: 24px;
  border-bottom: 2px solid var(--color-secondary-500);
  margin-bottom: 32px;
}
.exd-logo {
  height: 28px;
  margin-bottom: 12px;
  display: block;
}
.exd-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--color-secondary-500);
  margin-bottom: 4px;
}
.exd-sub {
  font-size: 12px;
  color: var(--color-neutral-800);
}
.exd-meta {
  display: grid;
  gap: 8px;
  align-content: end;
  font-size: 12px;
}
.exd-meta > div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--color-neutral-200);
}
.exd-meta > div:last-child { border-bottom: 0; }
.exd-meta span {
  color: var(--color-neutral-800);
  font-weight: 500;
}
.exd-meta strong {
  color: var(--color-secondary-500);
  font-weight: 700;
  font-size: 12.5px;
}

/* Sections */
.exd-section { margin-bottom: 28px; page-break-inside: avoid; }
.exd-included-section {
  background: var(--color-neutral-50);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-16);
  padding: 20px 22px;
}
.exd-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.exd-section h2 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--color-secondary-500);
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.exd-tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: var(--r-pill);
  background: hsla(151, 55%, 41%, 0.14);
  color: var(--color-success-600);
}
.exd-tag-primary {
  background: hsla(188, 99%, 39%, 0.14);
  color: var(--color-primary-600);
}
.exd-lead {
  font-size: 12.5px;
  color: var(--color-neutral-800);
  margin: 0 0 14px;
  line-height: 1.55;
}

/* Feature grid (socle / pack features) */
.exd-feature-grid {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
}
.exd-feature-grid li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  color: var(--color-secondary-500);
  padding: 4px 0;
}
.exd-feature-grid li .ico {
  font-size: 16px;
  color: var(--color-primary-500);
  flex-shrink: 0;
  margin-top: 1px;
}
.exd-feature-grid li em {
  font-style: italic;
  color: hsl(28, 78%, 38%);
  font-weight: 600;
  font-size: 11px;
}

/* CSM phases */
.exd-phases {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.exd-phase {
  padding: 12px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  background: var(--color-neutral-50);
}
.exd-phase-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-primary-500);
  margin-bottom: 4px;
}
.exd-phase-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-secondary-500);
  margin-bottom: 4px;
}
.exd-phase-desc {
  font-size: 11.5px;
  color: var(--color-neutral-800);
  line-height: 1.45;
}

/* Row lists */
.exd-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-8);
  overflow: hidden;
}
.exd-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  background: #fff;
}
.exd-row:last-child { border-bottom: 0; }
.exd-row-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-secondary-500);
  margin-bottom: 2px;
}
.exd-row-partner {
  font-weight: 500;
  color: var(--color-neutral-800);
}
.exd-row-desc {
  font-size: 11.5px;
  color: var(--color-neutral-800);
  line-height: 1.45;
}
.exd-row-price {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--color-secondary-500);
  white-space: nowrap;
  text-align: right;
}
.exd-row-price span {
  display: block;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--color-neutral-800);
  margin-top: 2px;
}

/* Pricing table */
.exd-pricing { page-break-before: auto; }
.exd-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin-bottom: 16px;
}
.exd-table td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--color-neutral-200);
  vertical-align: top;
}
.exd-table td:first-child {
  font-weight: 600;
  color: var(--color-secondary-500);
}
.exd-meta-cell {
  color: var(--color-neutral-800);
  font-weight: 500;
  font-size: 11.5px;
}
.exd-amount {
  text-align: right;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--color-secondary-500);
  white-space: nowrap;
}
.exd-amount span {
  font-family: var(--font-body);
  font-size: 10.5px;
  color: var(--color-neutral-800);
  font-weight: 500;
  margin-left: 2px;
}
.exd-amount.exd-included { color: var(--color-success-600); }
.exd-amount.exd-negative { color: hsl(0, 62%, 50%); }
.exd-subtotal td {
  background: var(--color-neutral-50);
  font-weight: 700 !important;
  border-bottom: 2px solid var(--color-neutral-300);
  padding: 12px 8px;
}
.exd-discount-row td { color: hsl(0, 62%, 45%); }

.exd-totals {
  background: var(--color-secondary-500);
  color: #fff;
  border-radius: var(--r-8);
  padding: 18px 20px;
}
.exd-total-line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
}
.exd-total-line span {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  opacity: 0.95;
}
.exd-total-line strong {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
}
.exd-total-line.muted {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.18);
  opacity: 0.85;
}
.exd-total-line.muted span,
.exd-total-line.muted strong { font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }

.exd-custom {
  padding: 24px;
  text-align: center;
  background: var(--color-neutral-50);
  border-radius: var(--r-8);
  border: 1px dashed var(--color-neutral-300);
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--color-secondary-500);
}

.exd-footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--color-neutral-800);
}

/* ─── Print ─────────────────────────────────────────────── */
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff !important; }
  body > *:not(#root) { display: none !important; }
  #root > *:not(.export-overlay) { display: none !important; }
  .export-overlay {

  PACKS, CSM_PHASES, CSM_SERVICES,
  INTERNAL_OPTIONS, EXTERNAL_OPTIONS, NEGO_RULES, COMM_RH_OPTIONS

// ─── Helpers ─────────────────────────────────────────────────
const formatEUR = (n) => {
  if (n === null || n === undefined) return 'Sur devis';
  return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
};
const fmtNum = (n) => new Intl.NumberFormat('fr-FR').format(n);

// ─── Quote engine (shared by config, summary & export) ───────
const computeQuote = (state) => {
  const {
    effectifId, accountType, selectedPacks, multiAccountQty,
    internal, internalQty, external, discountValue, discountType, monthsOffered,
    tierUpgrade, offeredPresta, assoc1901
  } = state;

  const activeTiers = accountType === 'public' ? EFFECTIF_PUBLIC_TIERS : EFFECTIF_TIERS;
  const effectif = activeTiers.find((e) => e.id === effectifId);
  const packs = PACKS.filter((p) => (selectedPacks || []).includes(p.id));
  const isCustom = effectif?.custom;

  // Remise d'un cran : facturer le palier inférieur (moins cher)
  const tierIdx = activeTiers.findIndex((t) => t.id === effectifId);
  const downgradeTier = tierIdx > 0 ? activeTiers[tierIdx - 1] : null;
  const canUpgrade = !!effectif && !effectif.custom && downgradeTier && !downgradeTier.custom;
  const tierDiscountActive = tierUpgrade && canUpgrade;
  const downgradeSaving = canUpgrade ? effectif.price - downgradeTier.price : 0;
  const upgradePct = canUpgrade && effectif.price ? Math.round(downgradeSaving / effectif.price * 100) : 0;

  const fullSoclePrice = isCustom ? null : effectif?.price ?? 0;
  const soclePrice = isCustom ? null : tierDiscountActive ? downgradeTier.price : effectif?.price ?? 0;
  const packPrice = packs.reduce((sum, p) => sum + (p.id === 'multi' ? p.price * (multiAccountQty || 1) : p.price), 0);

  const internalItems = INTERNAL_OPTIONS.filter((o) => internal.includes(o.id)).map(o => {
    const qty = (o.quantifiable && internalQty && internalQty[o.id]) ? internalQty[o.id] : 1;
    return { ...o, qty, unitPrice: o.price, price: o.price * qty };
  });
  const externalItems = EXTERNAL_OPTIONS.filter((o) => external.includes(o.id) && o.price !== null);
  const recurringInternalItems = internalItems.filter((o) => o.recurring);
  const oneShotItems = internalItems.filter((o) => !o.recurring);
  const recurringInternalTotal = recurringInternalItems.reduce((s, o) => s + o.price, 0);
  const oneShotTotal = oneShotItems.reduce((s, o) => s + o.price, 0);

  const offeredItems = INTERNAL_OPTIONS.filter((o) => (offeredPresta || []).includes(o.id));
  const offeredValue = offeredItems.reduce((s, o) => s + o.price, 0);

  // Abonnement récurrent (socle + pack + prestations récurrentes). Partenaires = hors facturation.
  // Year 2+ always uses full effectif price; tier downgrade saving is year-1 only (like months offered)
  const recurringSubtotal = (fullSoclePrice ?? 0) + packPrice + recurringInternalTotal;
  const pctDiscount = discountType === 'percent' ?
  Math.round(recurringSubtotal * ((discountValue || 0) / 100)) :
  discountValue || 0;
  const assoc1901Discount = assoc1901 ? Math.round(recurringSubtotal * 0.5) : 0;
  const discountAmount = pctDiscount + assoc1901Discount;
  const recurringYear2 = Math.max(0, recurringSubtotal - discountAmount);

  const monthsCount = Number(monthsOffered) || 0;
  // Tier downgrade applies year 1 only — subtract from year 2 base before months-offered calculation
  const tierYear1Saving = tierDiscountActive ? downgradeSaving : 0;
  const firstYearBase = Math.max(0, recurringYear2 - tierYear1Saving);
  // Months offered extend the contract duration — they do NOT reduce the invoice price
  const extendedMonths = monthsCount > 0 ? 12 + monthsCount : 12;
  const firstYearRecurring = firstYearBase;
  const firstYearTotal = firstYearRecurring + oneShotTotal;

  const gestureValue = offeredValue;
  const splitYears = oneShotTotal > 0 || tierDiscountActive;

  return {
    effectif, packs, isCustom, accountType, multiAccountQty,
    downgradeTier, canUpgrade, tierDiscountActive, downgradeSaving, upgradePct,
    fullSoclePrice, soclePrice, packPrice,
    internalItems, externalItems, oneShotTotal, recurringInternalItems, oneShotItems, recurringInternalTotal,
    offeredItems, offeredValue, gestureValue,
    recurringSubtotal, pctDiscount, assoc1901Discount, discountAmount,
    recurringYear2, monthsCount, extendedMonths, tierYear1Saving, firstYearBase, firstYearRecurring, firstYearTotal,
    splitYears, discountValue, discountType
  };
};

      externalItems: (q.externalItems || []).filter(o => !o.partner).map(o => ({ name: o.name, price: o.price || 0 })),
      oneShotItems: (q.oneShotItems || []).map(o => ({ name: o.name, price: o.price || 0, detail: o.qty > 1 ? o.qty + ' x ' + (o.unitPrice || 0) + ' EUR' : '' })),
      pctDiscount: q.pctDiscount || 0,
      discountType: q.discountType || '',
      discountValue: q.discountValue || 0,
      assoc1901Discount: q.assoc1901Discount || 0,

            <div className="crumb-sub">Sales & CSM · Édition 2026</div>

      </div>
      <div className="topbar-right">
        <button className="btn btn-ghost btn-sm" onClick={onExport}>
          <span className="ico">file_download</span>Exporter en PDF
        </button>
        <button className="btn btn-primary" onClick={generateSlides}>
          <span className="ico">slideshow</span>Plaquette commerciale
        </button>
      </div>
    </header>
  );
};

              </div>
          }
            {monthsCount > 0 &&
          <div className="total-line">
                <div><div className="line-label">{monthsCount} mois offert{monthsCount > 1 ? 's' : ''}</div><div className="line-meta">Contrat de {extendedMonths} mois · HT</div></div>

              <div style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 700, color: 'var(--color-secondary-500)' }} data-comment-anchor="40d6dc4bad-div-883-15">

              <div className="exd-list">

                    </div>
                    <div className="exd-row-price">
                      <span>Contrat partenaire</span>
                    </div>
                  </div>
              )}
              </div>
            </section>
          }

          {/* ─── Section : Récapitulatif tarifaire ─── */}
          <section className="exd-section exd-pricing">
            <div className="exd-section-head">
              <h2>Récapitulatif tarifaire</h2>
              <div className="exd-tag">HT</div>
            </div>

            {isCustom ?
            <div className="exd-custom">Sur devis — contactez votre Account Executive Flatchr.</div> :

            <>
                <table className="exd-table">
                  <tbody>
                    <tr>
                      <td>Socle fonctionnel</td>
                      <td className="exd-meta-cell">
                        {!effectif ? 'Non sélectionné · abonnement existant' :
                      accountType === 'cabinet' ? effectif?.cabinet : accountType === 'public' ? (effectif?.label ?? '—') + (effectif?.range ? ' · ' + effectif.range + ' hab.' : '') : effectif?.range}
                      </td>
                      <td className="exd-amount">
                        {!effectif ? <span className="exd-included">—</span> :
                      <>{formatEUR(fullSoclePrice ?? soclePrice)} <span>/ an</span></>}
                      </td>
                    </tr>
                    <tr>
                      <td>Accompagnement CSM</td>
                      <td className="exd-meta-cell">Inclus dans le socle</td>
                      <td className="exd-amount exd-included">Inclus</td>
                    </tr>
                    {packs.map(p => {
                      const pPrice = p.id === 'multi' ? p.price * (multiAccountQty || 1) : p.price;
                      return <tr key={p.id}>
                        <td>Pack {p.name}</td>
                        <td className="exd-meta-cell">
                          {p.id === 'multi' ? `${multiAccountQty} entité${multiAccountQty > 1 ? 's' : ''} × ${formatEUR(p.price)}` : 'Pack stratégique'}
                        </td>
                        <td className="exd-amount">{formatEUR(pPrice)} <span>/ an</span></td>
                      </tr>;
                    })}
                    {externalItems.map((o) =>
                  <tr key={'r-' + o.id}>
                        <td>{o.name}</td>
                        <td className="exd-meta-cell">{o.partner} · mise en relation</td>
                        <td className="exd-amount exd-included">Hors abonnement</td>
                      </tr>
                  )}
                    {recurringInternalItems.map((o) =>
                  <tr key={'ri-' + o.id}>
                        <td>{o.name}</td>
                        <td className="exd-meta-cell">Récurrent · tous les ans</td>
                        <td className="exd-amount">{formatEUR(o.price)} <span>/ an</span></td>
                      </tr>
                  )}
                    {pctDiscount > 0 &&
                  <tr className="exd-discount-row">
                        <td>Remise commerciale</td>
                        <td className="exd-meta-cell">{discountType === 'percent' ? `${discountValue} %` : formatEUR(discountValue)}</td>
                        <td className="exd-amount exd-negative">− {formatEUR(pctDiscount)}</td>

                  }
                    {assoc1901Discount > 0 &&
                  <tr className="exd-discount-row">
                        <td>Réduction association loi 1901</td>

                        <td className="exd-amount exd-negative">− {formatEUR(assoc1901Discount)}</td>

                  }
                    <tr className="exd-subtotal">
                      <td colSpan={2}>Abonnement annuel{splitYears ? ' · dès la 2ème année' : monthsCount > 0 ? ' · contrat de ' + extendedMonths + ' mois' : ''}</td>
                      <td className="exd-amount">{formatEUR(recurringYear2)} <span>/ an</span></td>

                    {paymentSchedule && paymentSchedule !== 'annual' && recurringYear2 > 0 &&
                    <tr className="exd-discount-row" style={{ background: 'var(--color-primary-50)' }}>

                      <td className="exd-meta-cell">Paiement aménagé</td>
                      <td className="exd-amount" style={{ color: 'var(--color-primary-700)', fontWeight: 600 }}>

                    {monthsCount > 0 &&

const App = () => {
  // ─── State ─────────────────────────────────────────────────
  const [effectifId, setEffectifId] = useState(null); // Aucun socle par défaut
  const [accountType, setAccountType] = useState('standard');
  const [selectedPacks, setSelectedPacks] = useState([]);
  const [multiAccountQty, setMultiAccountQty] = useState(5);
  const [internal, setInternal] = useState([]);
  const [internalQty, setInternalQtyState] = useState({});
  const [external, setExternal] = useState([]);
  const [discountValue, setDiscountValue] = useState(0);
  const [discountType, setDiscountType] = useState('percent');
  const [monthsOffered, setMonthsOffered] = useState(0);
  const [paymentSchedule, setPaymentSchedule] = useState('annual');
  const [commitment, setCommitment] = useState(12);
  const [drawerContent, setDrawerContent] = useState(null);
  const [activeSection, setActiveSection] = useState('socle');
  const [panelCollapsed, setPanelCollapsed] = useState(true);
  const [exportOpen, setExportOpen] = useState(false);
  const [tierUpgrade, setTierUpgrade] = useState(false);
  const [offeredPresta, setOfferedPresta] = useState([]);
  const [assoc1901, setAssoc1901] = useState(false);

  // ─── Actions ───────────────────────────────────────────────
  const actions = {
    setEffectif: setEffectifId,
    setAccountType: (type) => { setAccountType(type); setEffectifId(null); },
    togglePack: (id) => setSelectedPacks(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]),
    removePack: (id) => setSelectedPacks(prev => prev.filter(x => x !== id)),
    toggleInternal: (id) => {
      const isQuantifiable = INTERNAL_OPTIONS.find(o => o.id === id)?.quantifiable;
      const isSelected = internal.includes(id);
      setInternal(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      if (isQuantifiable) {
        if (isSelected) setInternalQtyState(prev => { const n = {...prev}; delete n[id]; return n; });
        else setInternalQtyState(prev => ({...prev, [id]: 1}));
      }
    },
    setInternalQty: (id, qty) => {
      if (qty <= 0) {
        setInternal(prev => prev.filter(x => x !== id));
        setInternalQtyState(prev => { const n = {...prev}; delete n[id]; return n; });
      } else {
        setInternal(prev => prev.includes(id) ? prev : [...prev, id]);
        setInternalQtyState(prev => ({...prev, [id]: qty}));
      }
    },
    toggleExternal: (id) => setExternal((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]),
    setDiscountValue,
    setDiscountType,
    setMonthsOffered,
    setPaymentSchedule,
    setCommitment,
    setTierUpgrade,
    setAssoc1901,
    toggleOfferedPresta: (id) => setOfferedPresta((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]),
    openExport: () => setExportOpen(true)
  };

  const state = {
    effectifId, accountType, selectedPacks, multiAccountQty,
    internal, internalQty, external, discountValue, discountType, monthsOffered,
    paymentSchedule, commitment, tierUpgrade, offeredPresta, assoc1901
  };

  const effectif = (accountType === 'public' ? EFFECTIF_PUBLIC_TIERS : EFFECTIF_TIERS).find((e) => e.id === effectifId);

  // ─── Section scroll spy ───────────────────────────────────
  useEffect(() => {
    const handler = () => {
      const scrollTop = window.scrollY;
      for (let i = SECTIONS.length - 1; i >= 0; i--) {
        const el = document.getElementById(SECTIONS[i].id);
        if (el && el.getBoundingClientRect().top < 200) {
          setActiveSection(SECTIONS[i].id);
          return;
        }
      }
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);

  const jumpToSection = (id) => {
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.offsetTop - 100, behavior: 'smooth' });
  };

  // ─── Drawer handlers ──────────────────────────────────────
  const openSocle = () => setDrawerContent({ type: 'socle', id: 'socle' });
  const openCSM = () => setDrawerContent({ type: 'csm', id: 'csm' });
  const openPack = (pack) => setDrawerContent({ type: 'pack', id: pack.id, data: pack });
  const openOption = (option, type) => setDrawerContent({ type, id: option.id, data: option });
  const closeDrawer = () => setDrawerContent(null);

  const handleDrawerToggleSelection = () => {
    if (!drawerContent) return;
    if (drawerContent.type === 'pack') {
      actions.togglePack(drawerContent.id);
    } else if (drawerContent.type === 'internal') {
      actions.toggleInternal(drawerContent.id);
    } else if (drawerContent.type === 'external') {
      actions.toggleExternal(drawerContent.id);
    }
  };

  const isDrawerSelected = drawerContent ?
  drawerContent.type === 'pack' ? selectedPacks.includes(drawerContent.id) :
  drawerContent.type === 'internal' ? internal.includes(drawerContent.id) :
  drawerContent.type === 'external' ? external.includes(drawerContent.id) : false :
  false;

  return (
    <>
      <TopBar onExport={() => setExportOpen(true)} state={state} />
      <ConfigPanel state={state} actions={actions} collapsed={panelCollapsed} />
      <div className={'app-shell' + (panelCollapsed ? ' panel-collapsed' : '')}>
        <main className="content">
          <SectionNav active={activeSection} onJump={jumpToSection} />
          <SocleSection effectif={effectif} accountType={accountType} onOpen={openSocle} />
          <CSMSection onOpen={openCSM} />
          <PacksSection selectedPacks={selectedPacks} onSelect={actions.togglePack} onOpen={openPack} multiAccountQty={multiAccountQty} onMultiQty={setMultiAccountQty} />
          <InternalSection selected={internal} onToggle={actions.toggleInternal} onOpen={openOption} internalQty={internalQty} onSetQty={actions.setInternalQty} />
          <ConsomSection />
          <ExternalSection selected={external} onToggle={actions.toggleExternal} onOpen={openOption} />
          <CommRHSection onOpen={openOption} />
        </main>
        <SummaryCard state={state} actions={actions} />
      </div>
      <button
        className="panel-toggle"
        onClick={() => setPanelCollapsed((v) => !v)}
        aria-label={panelCollapsed ? 'Afficher la configuration' : 'Masquer la configuration'}
        title={panelCollapsed ? "Configurer l'offre" : 'Masquer la configuration'} style={{ textAlign: "center", width: "35px", height: "77px" }}>
        <span className="ico panel-toggle-chevron">chevron_right</span>
      </button>
      <Drawer
        content={drawerContent}
        onClose={closeDrawer}
        onToggleSelection={handleDrawerToggleSelection}
        isSelected={isDrawerSelected} />
      
      <ExportModal
        open={exportOpen}
        onClose={() => setExportOpen(false)}
        state={state}
        effectif={effectif} />
    </>);

};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);</script>
</body>
